<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ztgate, Linux에서 C로 만든 L3 VPN + ZTNA 접근 제어">
