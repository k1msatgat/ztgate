# 푸시할 때마다 양쪽을 실제로 빌드한다.
#
#   server   Linux 서버와 클라이언트를 경고 없이 빌드하고, 패킷 수준의 인증 검사와
#            Linux 서버 <-> Linux 클라이언트 전체 경로(netns 두 개)를 돌린다.
#   docker   이미지를 빌드하고 서버 + 클라이언트 두 컨테이너로 전체 시나리오를 돌린다.
#   bench    부하 생성기로 서버 데이터 경로의 처리량을 재고 perf 로 어디서 시간을 쓰는지 본다.
#            실제 클라이언트를 띄워 터널을 지난 TCP / UDP 처리량을 직결과 나란히 잰다 (iperf3).
#   idp      Keycloak 을 띄워 README 의 설정대로 만들고, 그 IdP 가 준 토큰을 서버가 받는지 본다.
#   windows  Windows 클라이언트(콘솔 + 서비스 + MFC GUI)를 MSVC 로 빌드한다.
#
# 서버는 Linux 장비에서, 클라이언트는 Windows PC 에서 개발한다. 한쪽에서 고친 것이
# 다른 쪽을 깨뜨렸는지는 그 장비에 가서 빌드해 보기 전까지 알 수 없었다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (warnings are errors)
        run: make CFLAGS="-Wall -Wextra -Werror -g -O0"

      - name: One version everywhere (tools/check_version.sh)
        run: tools/check_version.sh

      - name: Crypto self test (server, client)
        run: |
          ./server/bin/vpn_server selftest
          ./client/bin/vpn_client selftest

      # 서버를 띄우고 클라이언트인 척 UDP 패킷을 만들어 보낸다. tun 을 만들어야 해서 root.
      - name: Protocol checks (test/auth_check.py)
        run: sudo python3 test/auth_check.py

      # 등록 -> 연결 -> ACL 차단 -> 포스처 거부와 복구. 클라이언트의 방화벽 포스처가 nft 를
      # 읽는다. 러너에서는 비특권 사용자 네임스페이스가 막혀 있어(AppArmor) sudo 로 돌린다 —
      # 스크립트가 root 면 unshare -n 으로 새 네트워크 네임스페이스를 만든다.
      - name: Linux end-to-end (test/linux_e2e.sh)
        run: |
          sudo apt-get install -y -qq nftables > /dev/null
          sudo test/linux_e2e.sh

      # 같은 시험을 워커 셋(-w 3)으로. 잠금이 빠진 곳이 있으면 판정이 어긋나거나 세션이 섞인다.
      - name: Protocol checks and end-to-end with 3 workers
        run: |
          sudo ZTGATE_WORKERS=3 python3 test/auth_check.py
          sudo ZTGATE_WORKERS=3 test/linux_e2e.sh

      # 웹 콘솔: 가짜 ztgate_ctl 앞에서 로그인, 세션 / CSRF, 화면, 바꾸는 요청이 무엇으로 가는지.
      - name: Web console (test/console_check.py)
        run: python3 test/console_check.py

      - name: Operator CLI (test/cli_check.py)
        run: python3 test/cli_check.py

      - name: Backup and restore (test/backup_check.sh)
        run: test/backup_check.sh

      - name: MCP server syntax
        working-directory: mcp
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node --check server.js
          node --check ctl.cjs

  # Dockerfile 과 docker-compose.yml 이 실제로 도는지. 개발 장비에는 docker 가 없다.
  # 다른 시험의 토큰은 시험용 도구(tools/idp/mint.py)가 만든다. 실제 IdP 의 토큰이 그 모양과
  # 같은지(aud 배열, 서명용이 아닌 키가 섞인 JWKS, 그룹 클레임)는 실제 IdP 로만 확인된다.
  # 같은 시험을 AddressSanitizer + UndefinedBehaviorSanitizer 로 빌드한 서버와 클라이언트로 돌린다.
  # 메모리를 넘겨 읽거나 정수가 넘치면 그 자리에서 멈추고, 보고서가 남으면 실패로 친다.
  sanitize:
    runs-on: ubuntu-24.04
    env:
      # 시험은 서버를 stdbuf(LD_PRELOAD)로 띄우므로 ASan 런타임이 맨 앞이 아니다. 그 검사만 끈다.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:verify_asan_link_order=0:log_path=/tmp/san/asan
      UBSAN_OPTIONS: print_stacktrace=1:log_path=/tmp/san/ubsan
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: make CFLAGS="-Wall -Wextra -Werror -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"

      - name: Protocol checks and end-to-end under sanitizers
        run: |
          sudo apt-get install -y -qq nftables > /dev/null
          sudo mkdir -p /tmp/san && sudo chmod 1777 /tmp/san
          ./server/bin/vpn_server selftest
          ./client/bin/vpn_client selftest
          sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS python3 test/auth_check.py
          sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS test/linux_e2e.sh
          sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS ZTGATE_WORKERS=3 python3 test/auth_check.py

      - name: No sanitizer reports
        if: always()
        run: |
          if ls /tmp/san/* > /dev/null 2>&1; then cat /tmp/san/*; exit 1; fi

  # 패킷 디코더, JSON 파서, devices.conf / acl.conf 한 줄을 libFuzzer 로 2분 흔든다 (test/fuzz).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the fuzzer
        run: |
          sudo apt-get install -y -qq clang > /dev/null
          make fuzz

      - name: Fuzz the parsers
        run: |
          mkdir -p corpus && cp test/fuzz/corpus/* corpus/
          ./test/fuzz/bin/fuzz_parsers -max_total_time=120 -timeout=10 -close_fd_mask=3 corpus

  idp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: make CFLAGS="-Wall -Wextra -Werror -g -O0" server

      - name: Start Keycloak
        run: |
          docker run -d --name kc -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0.7 start-dev --features=dpop

      - name: Tokens from a real IdP (test/keycloak_check.sh)
        run: test/keycloak_check.sh

      - name: Keycloak log
        if: failure()
        run: docker logs kc 2>&1 | tail -n 80

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Server + client containers (docker/demo.sh)
        run: docker/demo.sh

      - name: Image size
        run: docker image ls ztgate --format '{{.Repository}} {{.Size}}'

  # 서버 데이터 경로의 처리량. 개발 장비는 CPU 가 하나라 서버와 부하 생성기를 같이
  # 띄우면 서로 CPU 를 뺏는다 — 러너(4 vCPU)에서 둘을 다른 CPU 에 묶어 잰다.
  # 공유 VM 이라 절대값은 흔들린다. 같은 실행 안의 행끼리, 그리고 커밋 전후를 비교한다.
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make CFLAGS="-Wall -Wextra -Werror -g -O2" server client tools

      - name: Install perf
        continue-on-error: true
        run: sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" > /dev/null

      - name: Bench (tools/loadgen/bench.sh)
        run: |
          sudo PERF=1 tools/loadgen/bench.sh bench-out
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::notice title=bench::$(enc < bench-out/result.md)"
          if [ -s bench-out/perf.txt ]; then
            echo "::notice title=perf (56B, server log to file)::$(grep -v '^#' bench-out/perf.txt | grep -v '^$' | head -n 25 | enc)"
          fi
          cat bench-out/result.md >> "$GITHUB_STEP_SUMMARY"

      # 워커 수에 따른 처리량. 세션 넷을 동시에 보낸다 (세션 하나는 늘 한 워커로 간다).
      - name: Workers (tools/loadgen/bench_workers.sh)
        run: |
          sudo WORKERS="1 2" tools/loadgen/bench_workers.sh bench-out
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::notice title=workers::$(enc < bench-out/workers.md)"
          cat bench-out/workers.md >> "$GITHUB_STEP_SUMMARY"

      # 위의 값은 서버 혼자의 한계다. 사용자가 보는 속도(클라이언트의 TCP 가 터널을 지나
      # 얼마나 나오는가)는 실제 클라이언트를 띄워 iperf3 로, 같은 veth 의 직결 값과 함께 잰다.
      - name: Tunnel throughput (tools/loadgen/iperf.sh)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iperf3 > /dev/null
          sudo tools/loadgen/iperf.sh bench-out
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::notice title=iperf3::$(enc < bench-out/iperf.md)"
          cat bench-out/iperf.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench-out/
          if-no-files-found: ignore

  # 서버 패키지 (packaging/). 설치하면 설정과 서버 키가 생기고 서비스가 뜨는지, 다시 설치해도
  # 서버 키가 그대로인지, 지워도 /etc/ztgate 가 남는지를 실제로 설치해서 본다.
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make server CFLAGS="-Wall -Wextra -Werror -O2 -g"

      - name: Hardening flags (tools/check_hardening.sh)
        run: tools/check_hardening.sh server/bin/vpn_server

      - name: Package (packaging/build.sh deb)
        run: packaging/build.sh deb out

      - name: Install, start, reinstall, remove
        run: |
          set -x
          sudo apt-get install -y -qq ./out/ztgate-server_*.deb > /dev/null
          sudo test -s /etc/ztgate/server.key
          key=$(sudo sha256sum /etc/ztgate/server.key)
          sudo systemctl start ztgate
          sleep 2
          systemctl is-active ztgate
          echo '{"cmd":"status"}' | sudo /usr/sbin/ztgate_ctl
          sudo ztgate status
          [ "$(ps -o user= -C vpn_server | head -n 1)" = ztgate ]
          [ "$(sudo stat -c %U:%a /etc/ztgate/server.key)" = ztgate:600 ]
          [ "$(sudo stat -c %U:%a /etc/ztgate-console)" = root:700 ]
          backup=$(sudo ztgate-backup)
          sudo tar -tzf "$backup" | grep -qx ztgate/server.key
          sudo test -f /etc/logrotate.d/ztgate
          sudo apt-get install -y -qq --reinstall ./out/ztgate-server_*.deb > /dev/null
          systemctl is-active ztgate
          [ "$(sudo sha256sum /etc/ztgate/server.key)" = "$key" ]
          sudo apt-get purge -y -qq ztgate-server > /dev/null
          if systemctl is-active --quiet ztgate; then exit 1; fi
          [ "$(sudo sha256sum /etc/ztgate/server.key)" = "$key" ]
          test ! -e /opt/ztgate/server/bin/vpn_server

      - uses: actions/upload-artifact@v4
        with:
          name: ztgate-server-deb
          path: out/*.deb

  # RPM 은 Rocky Linux 9 (개발 서버와 같은 배포판) 컨테이너에서 만들고 설치한다. 컨테이너에는
  # systemd 가 없어 서비스는 띄우지 않는다 — postinst 가 그 경우를 건너뛰는지도 여기서 본다.
  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build, package, install, remove (rockylinux:9)
        run: |
          docker run --rm -v "$PWD:/src" -w /src rockylinux:9 bash -euxc '
            dnf -y -q install gcc make openssl-devel rpm-build > /dev/null
            make server CFLAGS="-Wall -Wextra -Werror -O2 -g"
            bash tools/check_hardening.sh server/bin/vpn_server
            packaging/build.sh rpm out
            dnf -y -q install ./out/ztgate-server-*.rpm > /dev/null
            test -s /etc/ztgate/server.key
            /opt/ztgate/server/bin/vpn_server selftest | tail -n 1
            rpm -e ztgate-server
            test -s /etc/ztgate/server.key
            test ! -e /opt/ztgate/server/bin/vpn_server
          '

      - uses: actions/upload-artifact@v4
        with:
          name: ztgate-server-rpm
          path: out/*.rpm

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Wintun 은 저장소에 넣지 않는다 (wintun.net 에서 받아 windows/third_party 에 푼다).
      # 받은 파일이 wintun.net 에 공개된 해시와 같은지 확인한 뒤에 푼다.
      - name: Fetch Wintun
        shell: pwsh
        run: |
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $want = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          $got = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "wintun.zip sha256 mismatch: $got" }
          Expand-Archive wintun.zip -DestinationPath windows\third_party

      - uses: microsoft/setup-msbuild@v2

      # 오류와 경고를 주석(annotation)으로도 올린다. 로그를 내려받지 않아도 무엇이
      # 깨졌는지 실행 결과 화면에서 바로 보인다.
      - name: Build vpn_client + vpn_service + vpn_gui (Release x64)
        shell: pwsh
        run: |
          msbuild windows\ztgate.sln -m -nologo -p:Configuration=Release -p:Platform=x64 "-flp:logfile=build.log;verbosity=minimal;encoding=utf-8"
          $code = $LASTEXITCODE

          $root = "$env:GITHUB_WORKSPACE\"
          $lines = Select-String -Path build.log -Pattern ': (fatal )?error |: warning ' |
              ForEach-Object { $_.Line.Trim().Replace($root, '') -replace ' \[[^\]]*\]$', '' } |
              Sort-Object -Unique

          function Annotate($kind, $items) {
              if (-not $items) { return }
              $text = (($items | Select-Object -First 60) -join "`n")
              $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::$kind title=msbuild ($(@($items).Count))::$text"
          }
          $errors = @($lines | Where-Object { $_ -match ': (fatal )?error ' })
          $warnings = @($lines | Where-Object { $_ -match ': warning ' })
          Annotate error $errors
          Annotate warning $warnings
          Write-Output "::notice title=msbuild::exit $code, $($errors.Count) errors, $($warnings.Count) warnings"

          exit $code

      # 깨끗한 PC 에는 VC++ 재배포 패키지도 MFC 도 없다. 실행 파일이 Windows 가 원래 가진 DLL 만 부르는지 본다.
      - name: No runtime DLLs to ship (static CRT and MFC)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -First 1).FullName
          $bad = foreach ($f in 'vpn_service.exe', 'vpn_client.exe', 'vpn_gui.exe') {
              & $dumpbin /dependents "windows/build/Release/$f" | Select-String -Pattern 'VCRUNTIME|MSVCP|mfc1|api-ms-win-crt' | ForEach-Object { "$f -> $($_.Line.Trim())" }
          }
          if ($bad) { $bad; exit 1 }
          'no VC++ / MFC runtime DLLs'

      # 관리자 권한도 어댑터도 필요 없는 것만 돌린다. 러너는 Windows Server 라
      # 보안 센터(wscapi.dll)가 없다 — 그런 곳에서도 클라이언트가 뜨는지가 함께 확인된다.
      - name: Posture on this runner
        shell: pwsh
        run: |
          $out = (& windows\build\Release\vpn_client.exe posture 2>&1 | Out-String).Trim()
          Write-Output $out
          $text = "exit $LASTEXITCODE`n$out".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::notice title=vpn_client posture::$text"

      - name: HMAC-SHA256 self test
        shell: pwsh
        run: |
          $out = (& windows\build\Release\vpn_client.exe selftest 2>&1 | Out-String).Trim()
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
              $text = "exit $code`n$out".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=vpn_client selftest::$text"
              exit 1
          }

      # wintun.dll 은 WireGuard LLC 의 바이너리라, 함께 내보낼 때 그 라이선스도 옆에 둔다.
      - name: Put the Wintun license next to wintun.dll
        shell: pwsh
        run: Copy-Item windows\third_party\wintun\LICENSE.txt windows\build\Release\wintun-LICENSE.txt

      # 코드 서명. 저장소 Secrets 에 인증서가 있을 때만 (없으면 경고 하나 남기고 지나간다).
      # wintun.dll 은 WireGuard LLC 가 이미 서명했다.
      - name: Sign executables (windows/installer/sign.ps1)
        shell: pwsh
        env:
          ZTGATE_SIGN_PFX_BASE64: ${{ secrets.ZTGATE_SIGN_PFX_BASE64 }}
          ZTGATE_SIGN_PFX_PASSWORD: ${{ secrets.ZTGATE_SIGN_PFX_PASSWORD }}
        run: windows/installer/sign.ps1 windows/build/Release/vpn_service.exe windows/build/Release/vpn_client.exe windows/build/Release/vpn_gui.exe

      # 설치 파일. WiX 3 은 러너 이미지에 기대지 않고 Wintun 처럼 받아 해시를 확인한다.
      - name: Installer (windows/installer/build.ps1)
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $want = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          $got = (Get-FileHash wix.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "wix.zip sha256 mismatch: $got" }
          Expand-Archive wix.zip -DestinationPath wix
          windows\installer\build.ps1 -Wix "$env:GITHUB_WORKSPACE\wix"

      - name: Sign the installer
        shell: pwsh
        env:
          ZTGATE_SIGN_PFX_BASE64: ${{ secrets.ZTGATE_SIGN_PFX_BASE64 }}
          ZTGATE_SIGN_PFX_PASSWORD: ${{ secrets.ZTGATE_SIGN_PFX_PASSWORD }}
        run: windows/installer/sign.ps1 windows/build/Release/ztgate.msi

      - uses: actions/upload-artifact@v4
        with:
          name: ztgate-windows-x64
          path: |
            windows/build/Release/*.exe
            windows/build/Release/wintun.dll
            windows/build/Release/wintun-LICENSE.txt
            windows/build/Release/ztgate.msi
          if-no-files-found: error
